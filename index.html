
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1428;color:white;font-family:Arial,sans-serif;padding:18px}
main{max-width:850px;margin:auto}
section{background:#192440;padding:18px;border-radius:15px;margin:14px 0}
h1,h2{color:#67e8f9}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:15px}
input{background:#101a30;color:white;border:1px solid #465675}
button{border:0;background:#22c8dc;color:#071626;font-weight:bold;cursor:pointer}
button.secondary{background:#344563;color:white}
button.small{width:auto;padding:8px 12px}
.item{background:#101a30;padding:12px;border-radius:9px;margin:7px 0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.row button{width:auto;min-width:85px}
#messages{height:320px;overflow-y:auto;background:#101a30;padding:10px;border-radius:10px}
.msg{padding:9px;margin:7px 0;background:#263653;border-radius:9px;overflow-wrap:anywhere}
.muted{color:#b8c5dc;font-size:13px;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<h1>Private Chat</h1>
<p class="muted">友達とつながるチャット</p>

<section id="loginArea">
<h2>アカウント</h2>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード（6文字以上）">
<button id="register">新規登録</button>
<button id="login" class="secondary">ログイン</button>
</section>

<div id="appArea" class="hidden">

<section>
<h2>プロフィール</h2>
<p id="myUid" class="muted"></p>
<input id="nickname" maxlength="20" placeholder="ニックネーム">
<button id="saveProfile">ニックネームを保存</button>
<p id="profileStatus" class="muted"></p>
<button id="logout" class="secondary">ログアウト</button>
</section>

<section>
<h2>1対1チャット申請</h2>
<p class="muted">相手のUIDを入力して申請するよ。</p>
<input id="friendUid" placeholder="相手のUID">
<button id="sendFriend">申請を送る</button>
<p id="friendStatus" class="muted"></p>
</section>

<section>
<h2>届いた申請・招待</h2>
<div id="inviteList">読み込み中...</div>
</section>

<section>
<h2>グループ作成</h2>
<input id="groupName" maxlength="40" placeholder="グループ名">
<button id="createGroup">グループを作成</button>
<p id="groupStatus" class="muted"></p>
</section>

<section>
<h2>トーク一覧</h2>
<div id="chatList">まだトークはありません。</div>
</section>

<section id="chatArea" class="hidden">
<h2 id="chatTitle">トーク</h2>
<p id="chatInfo" class="muted"></p>

<div id="groupInviteArea" class="hidden">
<h3>メンバー招待</h3>
<div class="row">
<input id="groupInviteUid" placeholder="招待する人のUID">
<button id="sendGroupInvite">招待</button>
</div>
</div>

<div id="messages"></div>
<div class="row">
<input id="messageInput" placeholder="メッセージを入力">
<button id="sendMessage">送信</button>
</div>
<p id="messageStatus" class="muted"></p>
</section>
</div>

<p id="status" class="muted">ログインまたは新規登録してください。</p>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getDatabase,ref,get,set,push,onValue,off,remove
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyAiRLrBuQ73Esd59SUWPmvjCSfvOL2M-Pw",
 authDomain: "ctse-642a6.firebaseapp.com",
 databaseURL: "https://ctse-642a6-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "ctse-642a6",
 storageBucket: "ctse-642a6.firebasestorage.app",
 messagingSenderId: "991350907147",
 appId: "1:1014367962448:web:192e1f5585ff561319c20e"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let currentUser=null;
let currentChat=null;
let messageRef=null;
let chatListRef=null;
let inviteRef=null;

function show(id,visible){
 $(id).classList.toggle("hidden",!visible);
}
function err(e){
 return e?.message||String(e);
}

// 新規登録
$("register").onclick=async()=>{
 try{
  await createUserWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
  $("status").textContent="登録できました！";
 }catch(e){
  $("status").textContent="登録エラー："+err(e);
 }
};

// ログイン
$("login").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){
  $("status").textContent="ログインエラー："+err(e);
 }
};

// ログアウト
$("logout").onclick=async()=>{
 try{
  await signOut(auth);
 }catch(e){
  $("status").textContent=err(e);
 }
};

// プロフィール保存
$("saveProfile").onclick=async()=>{
 if(!currentUser)return;
 const name=$("nickname").value.trim();
 if(!name||name.length>20){
  $("profileStatus").textContent="1〜20文字で入力してね。";
  return;
 }
 try{
  await set(ref(db,"users/"+currentUser.uid),{
   nickname:name
  });
  $("profileStatus").textContent="保存しました！";
 }catch(e){
  $("profileStatus").textContent="保存エラー："+err(e);
 }
};

// チャットの基本情報を作成
async function createChat(type,title,recipient=null){
 const chatId=push(ref(db,"chats")).key;
 const base="chats/"+chatId;

 await set(ref(db,base+"/owner"),currentUser.uid);
 await set(ref(db,base+"/type"),type);
 await set(ref(db,base+"/title"),title);
 await set(ref(db,base+"/createdAt"),Date.now());

 if(recipient){
  await set(ref(db,base+"/directRecipient"),recipient);
 }

 await set(ref(db,base+"/members/"+currentUser.uid),true);
 await set(ref(db,"userChats/"+currentUser.uid+"/"+chatId),true);

 return chatId;
}

// 1対1チャット申請
$("sendFriend").onclick=async()=>{
 const target=$("friendUid").value.trim();

 if(!target||target===currentUser.uid){
  $("friendStatus").textContent="正しい相手のUIDを入力してね。";
  return;
 }

 try{
  const targetUser=await get(ref(db,"users/"+target));

  if(!targetUser.exists()){
   $("friendStatus").textContent="ユーザーが見つからないよ。";
   return;
  }

  const chatId=await createChat(
   "direct","1対1チャット",target
  );

  await set(ref(db,"invites/"+target+"/"+chatId),{
   sender:currentUser.uid,
   type:"direct"
  });

  $("friendStatus").textContent="申請を送ったよ！";
  $("friendUid").value="";
 }catch(e){
  $("friendStatus").textContent="申請エラー："+err(e);
 }
};

// グループ作成
$("createGroup").onclick=async()=>{
 const title=$("groupName").value.trim();

 if(!title||title.length>40){
  $("groupStatus").textContent="1〜40文字で入力してね。";
  return;
 }

 try{
  await createChat("group",title);
  $("groupStatus").textContent="グループを作成したよ！";
  $("groupName").value="";
 }catch(e){
  $("groupStatus").textContent="作成エラー："+err(e);
 }
};

// グループ招待
$("sendGroupInvite").onclick=async()=>{
 if(!currentChat)return;

 const target=$("groupInviteUid").value.trim();

 if(!target||target===currentUser.uid){
  $("messageStatus").textContent="正しいUIDを入力してね。";
  return;
 }

 try{
  const chat=await get(ref(db,"chats/"+currentChat));

  if(!chat.exists()||chat.val().owner!==currentUser.uid||
     chat.val().type!=="group"){
   $("messageStatus").textContent="招待できません。";
   return;
  }

  const user=await get(ref(db,"users/"+target));

  if(!user.exists()){
   $("messageStatus").textContent="ユーザーが見つからないよ。";
   return;
  }

  await set(ref(db,"invites/"+target+"/"+currentChat),{
   sender:currentUser.uid,
   type:"group"
  });

  $("messageStatus").textContent="招待を送ったよ！";
  $("groupInviteUid").value="";
 }catch(e){
  $("messageStatus").textContent="招待エラー："+err(e);
 }
};

// 招待一覧
function watchInvites(){
 if(inviteRef)off(inviteRef);

 inviteRef=ref(db,"invites/"+currentUser.uid);

 onValue(inviteRef,snapshot=>{
  const list=$("inviteList");
  list.replaceChildren();

  if(!snapshot.exists()){
   list.textContent="届いた申請はありません。";
   return;
  }

  for(const [chatId,invite] of Object.entries(snapshot.val())){
   const box=document.createElement("div");
   box.className="item";

   const label=document.createElement("p");
   label.textContent=
    (invite.type==="group"?"グループ招待":"1対1チャット申請")+
    " / 送信者UID："+invite.sender;
   box.append(label);

   const accept=document.createElement("button");
   accept.className="small";
   accept.textContent="承認";

   accept.onclick=async()=>{
    try{
     const chat=await get(ref(db,"chats/"+chatId));

     if(!chat.exists())throw new Error("チャットが見つかりません。");

     const data=chat.val();

     if(data.type==="direct"&&data.directRecipient!==currentUser.uid){
      throw new Error("この招待は無効です。");
     }

     await set(ref(db,"chats/"+chatId+"/members/"+currentUser.uid),true);
     await set(ref(db,"userChats/"+currentUser.uid+"/"+chatId),true);
     await remove(ref(db,"invites/"+currentUser.uid+"/"+chatId));

     $("status").textContent="招待を承認しました！";
    }catch(e){
     $("status").textContent="承認エラー："+err(e);
    }
   };

   const reject=document.createElement("button");
   reject.className="small secondary";
   reject.textContent="拒否";

   reject.onclick=async()=>{
    try{
     await remove(ref(db,"invites/"+currentUser.uid+"/"+chatId));
    }catch(e){
     $("status").textContent="拒否エラー："+err(e);
    }
   };

   box.append(accept,reject);
   list.append(box);
  }
 });
}

// トーク一覧
async function refreshChats(snapshot){
 const list=$("chatList");
 list.replaceChildren();

 if(!snapshot.exists()){
  list.textContent="まだトークはありません。";
  return;
 }

 for(const chatId of Object.keys(snapshot.val())){
  try{
   const snap=await get(ref(db,"chats/"+chatId));
   if(!snap.exists())continue;

   const chat=snap.val();
   const button=document.createElement("button");
   button.className="secondary";
   button.textContent=
    (chat.type==="group"?"グループ：":"1対1：")+
    (chat.title||"トーク");

   button.onclick=()=>openChat(chatId,chat);
   list.append(button);
  }catch(e){
   console.error(e);
  }
 }
}

// チャットを開く
function openChat(chatId,chat){
 currentChat=chatId;

 show("chatArea",true);
 $("chatTitle").textContent=chat.title||"トーク";
 $("chatInfo").textContent="チャットID："+chatId;
 $("messageStatus").textContent="";

 show(
  "groupInviteArea",
  chat.type==="group"&&chat.owner===currentUser.uid
 );

 if(messageRef)off(messageRef);

 messageRef=ref(db,"chats/"+chatId+"/messages");

 onValue(messageRef,snapshot=>{
  const area=$("messages");
  area.replaceChildren();

  if(!snapshot.exists()){
   area.textContent="メッセージはまだありません。";
   return;
  }

  for(const msg of Object.values(snapshot.val())){
   const item=document.createElement("div");
   item.className="msg";

   const sender=document.createElement("div");
   sender.className="muted";
   sender.textContent=
    msg.sender===currentUser.uid?"自分":"UID："+msg.sender;

   const content=document.createElement("div");
   content.textContent=msg.text;

   const time=document.createElement("div");
   time.className="muted";
   time.textContent=
    new Date(msg.timestamp).toLocaleString("ja-JP");

   item.append(sender,content,time);
   area.append(item);
  }

  area.scrollTop=area.scrollHeight;
 },error=>{
  $("messageStatus").textContent="読み込みエラー："+err(error);
 });
}

// メッセージ送信
async function sendMessage(){
 const text=$("messageInput").value.trim();

 if(!currentChat||!text)return;

 if(text.length>2000){
  $("messageStatus").textContent="2000文字以内にしてね。";
  return;
 }

 try{
  await push(ref(db,"chats/"+currentChat+"/messages"),{
   sender:currentUser.uid,
   text,
   timestamp:Date.now()
  });

  $("messageInput").value="";
  $("messageStatus").textContent="";
 }catch(e){
  $("messageStatus").textContent="送信エラー："+err(e);
 }
}

$("sendMessage").onclick=sendMessage;
$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

// ログイン状態
onAuthStateChanged(auth,async user=>{
 currentUser=user;
 currentChat=null;

 if(messageRef){
  off(messageRef);
  messageRef=null;
 }

 show("loginArea",!user);
 show("appArea",!!user);
 show("chatArea",false);

 if(!user){
  if(chatListRef)off(chatListRef);
  if(inviteRef)off(inviteRef);
  chatListRef=null;
  inviteRef=null;
  $("status").textContent="ログインしてください。";
  return;
 }

 $("status").textContent="ログイン中です。";
 $("myUid").textContent="あなたのUID："+user.uid;

 try{
  const profile=await get(ref(db,"users/"+user.uid));
  $("nickname").value=
   profile.exists()?profile.val().nickname||"":"";
 }catch(e){
  $("profileStatus").textContent="読み込みエラー："+err(e);
 }

 watchInvites();

 if(chatListRef)off(chatListRef);
 chatListRef=ref(db,"userChats/"+user.uid);

 onValue(chatListRef,refreshChats,error=>{
  $("status").textContent="トーク一覧エラー："+err(error);
 });
});
</script>
</body>
</html>
